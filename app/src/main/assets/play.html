<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1424">
<title>Pulse Games</title>
<style>
  :root { --bg:#0b1424; --text:#f3f6fb; --soft:#9fb0c8; --line:rgba(255,255,255,.14);
          --r:#ef4444; --g:#22c55e; --b:#3b82f6; --y:#facc15; --aura:#3b82f6; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--text);
               font:16px/1.3 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  body { display:flex; flex-direction:column; height:100%; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { display:flex; align-items:center; gap:10px; padding:12px 16px 4px; z-index:5; }
  header b { font-size:17px; letter-spacing:.6px; flex:1; }
  header b i { font-style:normal; color:var(--y); }
  header span { color:var(--soft); font-size:12px; }
  #mute { background:none; border:0; color:var(--text); font-size:20px; padding:2px 4px; cursor:pointer; }
  .screen { flex:1; display:none; flex-direction:column; min-height:0; position:relative; }
  .screen.on { display:flex; }
  .panel { margin:9vh 16px 0; background:rgba(255,255,255,.07); border:1px solid var(--line); border-radius:24px; padding:22px;
           backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); animation:rise .5s cubic-bezier(.2,.9,.3,1.2); }
  h2 { margin:0 0 6px; font-size:24px; }
  p.soft { color:var(--soft); margin:0 0 16px; }
  input { width:100%; padding:15px 16px; border-radius:16px; border:1px solid var(--line); background:rgba(0,0,0,.28);
          color:var(--text); font-size:17px; outline:none; user-select:text; -webkit-user-select:text; font-family:inherit; }
  button { border:0; border-radius:16px; padding:15px 18px; font-size:16px; font-weight:700; color:#0b1424; background:#fff;
           cursor:pointer; transition:transform .12s, opacity .2s; font-family:inherit; }
  button:active { transform:scale(.95); }
  button.ghost { background:rgba(255,255,255,.12); color:var(--text); border:1px solid var(--line); }
  button.hot { background:var(--y); }
  button:disabled { opacity:.3; }
  .row { display:flex; gap:10px; margin-top:12px; }
  .row > * { flex:1; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { padding:8px 12px; border-radius:999px; background:rgba(255,255,255,.1); border:1px solid var(--line); font-size:14px; animation:pop .35s; }
  .toast { position:fixed; left:50%; bottom:190px; transform:translateX(-50%) translateY(20px); opacity:0; background:#fff; color:#0b1424;
           padding:10px 16px; border-radius:14px; font-weight:700; transition:all .25s; pointer-events:none; z-index:60; white-space:nowrap; }
  .toast.on { opacity:1; transform:translateX(-50%) translateY(0); }
  #fx { position:fixed; inset:0; pointer-events:none; z-index:20; }
  #fx .card { position:fixed; left:0; top:0; margin:0; }
  #confetti { position:fixed; inset:0; pointer-events:none; z-index:55; }
  .win { font-size:34px; font-weight:900; text-align:center; font-style:italic; }
  .score { text-align:center; color:var(--soft); margin-top:6px; }

  /* ================= UNO ================= */
  body.uno #felt { position:fixed; inset:0; z-index:-1;
    background:radial-gradient(130% 70% at 50% 45%, #17325a 0%, #0d1a2e 60%, #070d18 100%); }
  body.uno #felt::before { content:""; position:absolute; inset:0; background:radial-gradient(60% 40% at 50% 46%, var(--aura) 0%, transparent 70%);
    opacity:.32; transition:background .8s; }
  body.uno #felt::after { content:""; position:absolute; inset:0; opacity:.07;
    background-image:radial-gradient(#fff 1px, transparent 1px); background-size:4px 4px; }
  #opps { display:flex; justify-content:center; gap:14px; padding:6px 10px 0; min-height:116px; }
  .opp { display:flex; flex-direction:column; align-items:center; gap:5px; position:relative; min-width:84px;
         padding:8px 10px 6px; border-radius:20px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); transition:all .3s; }
  .opp.turn { background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.35); box-shadow:0 0 28px color-mix(in srgb, var(--aura) 55%, transparent); }
  .ava { width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800;
         background:linear-gradient(145deg, #3b5a85, #1d2c44); border:2px solid rgba(255,255,255,.25); }
  .oname { font-size:13px; color:var(--soft); max-width:96px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .opp.turn .oname { color:#fff; font-weight:700; }
  .ofan { position:relative; height:34px; width:84px; }
  .ofan .mini { position:absolute; top:0; width:22px; height:32px; border-radius:5px; background:#111; border:2px solid #f3f3f3; box-shadow:0 2px 4px rgba(0,0,0,.4); }
  .ofan .mini::after { content:""; position:absolute; inset:3px; border-radius:50%/40%; background:var(--r); transform:rotate(-25deg); }
  .count { position:absolute; right:-6px; top:-8px; background:#fff; color:#0b1424; border-radius:999px; font-size:11px; font-weight:800; padding:2px 6px; }
  .unotag { position:absolute; left:-6px; top:-8px; background:var(--y); color:#000; border-radius:8px; font-size:11px; font-weight:900; padding:2px 6px; transform:rotate(-8deg); animation:pop .4s; }
  .wins { font-size:11px; color:var(--soft); }
  .dots { height:6px; display:flex; gap:3px; opacity:0; }
  .opp.turn .dots { opacity:1; }
  .dots i { width:5px; height:5px; border-radius:50%; background:#fff; animation:dot 1s infinite; }
  .dots i:nth-child(2) { animation-delay:.15s; } .dots i:nth-child(3) { animation-delay:.3s; }
  #table { flex:1; position:relative; display:flex; align-items:center; justify-content:center; min-height:190px; }
  #ring { position:absolute; width:250px; height:250px; border-radius:50%; border:2px dashed rgba(255,255,255,.12); animation:spin 22s linear infinite; }
  #ring.ccw { animation-direction:reverse; }
  #ring::before, #ring::after { content:"\27A4"; position:absolute; font-size:16px; color:rgba(255,255,255,.35); }
  #ring::before { top:-11px; left:50%; } #ring::after { bottom:-11px; right:50%; transform:rotate(180deg); }
  #deckpile { display:flex; gap:26px; align-items:center; position:relative; }
  #deck { position:relative; width:84px; height:124px; cursor:pointer; }
  #deck .card { position:absolute; left:0; top:0; }
  #deck .card:nth-child(1) { transform:translate(-4px,4px); } #deck .card:nth-child(2) { transform:translate(-2px,2px); }
  #deck.can .card:last-child { animation:nudge 1.4s ease-in-out infinite; box-shadow:0 0 0 3px #fff, 0 0 26px rgba(255,255,255,.55); }
  #pile { position:relative; width:84px; height:124px; }
  #pile .card { position:absolute; left:0; top:0; }
  #status { text-align:center; padding:6px 0 2px; min-height:34px; }
  #status span { display:inline-block; padding:6px 14px; border-radius:999px; background:rgba(0,0,0,.3); font-weight:700; font-size:15px; }
  #status span.mine { background:#fff; color:#0b1424; animation:pulse 1.6s ease-in-out infinite; }
  #actions { display:flex; gap:10px; padding:4px 16px 0; min-height:52px; }
  #actions button { flex:1; padding:12px; }
  #hand { position:relative; height:158px; margin-top:4px; }
  #hand .card { position:absolute; bottom:24px; transition:transform .35s cubic-bezier(.2,.9,.3,1.2), opacity .3s, box-shadow .3s; transform-origin:50% 120%; }
  #hand .card.ok { box-shadow:0 0 0 3px #fff, 0 10px 22px rgba(0,0,0,.5), 0 0 20px rgba(255,255,255,.45); }
  #hand .card.no { filter:saturate(.45) brightness(.6); }
  .card { width:84px; height:124px; border-radius:13px; position:relative; color:#fff; overflow:hidden; flex:0 0 auto;
          box-shadow:0 8px 18px rgba(0,0,0,.45); background:#fff; }
  .card .face { position:absolute; inset:5px; border-radius:9px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .card .face::before { content:""; position:absolute; inset:12px 6px; border-radius:50%/42%; background:#fff; transform:rotate(-28deg); }
  .card .face::after { content:""; position:absolute; inset:0; background:linear-gradient(140deg, rgba(255,255,255,.28) 0%, transparent 40%); }
  .card .big { position:relative; font-size:40px; font-weight:900; font-style:italic; text-shadow:2px 2px 0 rgba(0,0,0,.25); z-index:1; }
  .card .corner { position:absolute; font-size:13px; font-weight:900; font-style:italic; color:#fff; text-shadow:1px 1px 0 rgba(0,0,0,.4); z-index:2; }
  .card .tl { left:9px; top:7px; } .card .br { right:9px; bottom:7px; transform:rotate(180deg); }
  .c0 .face { background:var(--r); } .c0 .big { color:var(--r); }
  .c1 .face { background:var(--g); } .c1 .big { color:var(--g); }
  .c2 .face { background:var(--b); } .c2 .big { color:var(--b); }
  .c3 .face { background:var(--y); } .c3 .big { color:#c99a00; }
  .c4 .face { background:#111; }
  .c4 .face::before { background:conic-gradient(var(--r) 0 25%, var(--b) 0 50%, var(--y) 0 75%, var(--g) 0); }
  .c4 .big { color:#fff; text-shadow:0 0 6px #000, 2px 2px 0 #000; }
  .back .face { background:#111; }
  .back .face::before { background:var(--r); }
  .back .big { color:var(--y); font-size:22px; transform:rotate(-20deg); text-shadow:2px 2px 0 #111; }
  .banner { position:fixed; left:50%; top:44%; transform:translate(-50%,-50%); font-size:54px; font-weight:900; font-style:italic;
            color:#fff; text-shadow:0 4px 0 rgba(0,0,0,.35), 0 0 30px rgba(255,255,255,.4); white-space:nowrap; z-index:30;
            animation:banner 1.1s cubic-bezier(.2,.9,.3,1.3) forwards; pointer-events:none; }
  .burst { position:fixed; width:40px; height:40px; border-radius:50%; z-index:15; pointer-events:none; animation:burst .8s ease-out forwards; }
  .pick { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:flex-end; z-index:40; }
  .pick.on { display:flex; }
  .pick .sheet { width:100%; background:#14223a; border-radius:26px 26px 0 0; padding:22px 18px 30px; animation:rise .35s cubic-bezier(.2,.9,.3,1.1); }
  .swatches { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:14px; }
  .swatches button { height:70px; width:70px; border-radius:50%; padding:0; justify-self:center; box-shadow:0 0 0 4px rgba(255,255,255,.2); }

  /* ================= BUCKSHOT: grim pixel room ================= */
  body.buck { --text:#e7dccb; --soft:#9b8f7f; background:#0a0a09; font-family:"Courier New", ui-monospace, monospace; }
  body.buck header b { letter-spacing:3px; text-transform:uppercase; }
  body.buck header b i { color:#c2361f; }
  body.buck .panel { background:#16140f; border:3px solid #3a342a; border-radius:0; box-shadow:6px 6px 0 #000; backdrop-filter:none; }
  body.buck button { border-radius:0; font-family:inherit; letter-spacing:2px; text-transform:uppercase; background:#e7dccb; color:#14110c;
                     box-shadow:4px 4px 0 #000; border:2px solid #000; }
  body.buck button.ghost { background:#24201a; color:#e7dccb; border:2px solid #4a4236; }
  body.buck input { border-radius:0; background:#0f0e0b; border:2px solid #3a342a; font-family:inherit; }
  body.buck .chip { border-radius:0; background:#24201a; border:2px solid #3a342a; }
  #bk { flex:1; position:relative; display:flex; flex-direction:column; min-height:0; }
  #scene { width:100%; flex:1; min-height:0; image-rendering:pixelated; image-rendering:crisp-edges; display:block; }
  #crt { position:fixed; inset:0; pointer-events:none; z-index:25; display:none;
         background:repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px), radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(0,0,0,.75) 100%); }
  body.buck #crt { display:block; }
  #flash { position:fixed; inset:0; pointer-events:none; z-index:24; background:#fff; opacity:0; }
  #bkmsg { text-align:center; min-height:52px; margin:0 14px; padding:9px 4px 7px; letter-spacing:2px; text-transform:uppercase; text-shadow:2px 2px 0 #000;
           font-size:13px; line-height:1.45; border-top:2px dashed #2a251e; border-bottom:2px dashed #2a251e; color:#cfc4b2; }
  #bkmsg b { color:#e04a2e; }
  #bkitems { display:flex; gap:10px; justify-content:center; padding:12px 10px 0; min-height:74px; }
  #bkitems .none { color:var(--soft); letter-spacing:3px; font-size:11px; padding-top:20px; }
  .bit { width:56px; height:56px; background:#1b1813; border:2px solid #4a4236; box-shadow:3px 3px 0 #000; display:flex; align-items:center;
         justify-content:center; cursor:pointer; position:relative; transition:transform .15s, border-color .15s, box-shadow .15s; }
  .bit:active { transform:scale(.9); }
  .bit canvas { width:40px; height:40px; image-rendering:pixelated; }
  .bit.off { opacity:.35; }
  .bit.sel { border-color:#d9b34a; transform:translateY(-6px); box-shadow:0 0 0 2px #000, 0 0 18px rgba(217,179,74,.45), 3px 9px 0 #000; }
  .bit span { position:absolute; bottom:-16px; left:50%; transform:translateX(-50%); font-size:9px; letter-spacing:1px; color:var(--soft); white-space:nowrap; }
  .bit.sel span { color:#d9b34a; }
  #bkact { display:flex; gap:10px; padding:22px 14px 14px; }
  #bkact button { flex:1; padding:15px 6px; font-size:14px; transition:opacity .25s, transform .12s; }
  #bkact button.shoot { background:#a8281a; color:#fff; border-color:#000; }
  body.buck.mine #bkact button.shoot:not(:disabled) { animation:dread 1.8s ease-in-out infinite; }
  body.buck.busy #bkact button, body.buck.busy .bit { opacity:.35; pointer-events:none; }
  @keyframes dread { 0%,100% { box-shadow:4px 4px 0 #000; } 50% { box-shadow:4px 4px 0 #000, 0 0 22px rgba(224,74,46,.55); } }
  .shake { animation:shake2 .4s; }

  @keyframes rise { from { transform:translateY(30px); opacity:0; } }
  @keyframes pop { from { transform:scale(.6); opacity:0; } }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes dot { 0%,100% { transform:translateY(0); opacity:.4; } 50% { transform:translateY(-4px); opacity:1; } }
  @keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.07); } }
  @keyframes nudge { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-6px); } }
  @keyframes banner { 0% { transform:translate(-50%,-50%) scale(.3) rotate(-12deg); opacity:0; }
                      30% { transform:translate(-50%,-50%) scale(1.15) rotate(-6deg); opacity:1; }
                      75% { transform:translate(-50%,-50%) scale(1) rotate(-6deg); opacity:1; }
                      100% { transform:translate(-50%,-80%) scale(.9) rotate(-6deg); opacity:0; } }
  @keyframes burst { from { transform:translate(-50%,-50%) scale(1); opacity:.9; } to { transform:translate(-50%,-50%) scale(14); opacity:0; } }
  @keyframes shake { 0%,100% { margin-left:0; } 25% { margin-left:-8px; } 75% { margin-left:8px; } }
  @keyframes shake2 { 0%,100% { transform:translate(0,0); } 20% { transform:translate(-7px,3px); } 40% { transform:translate(6px,-4px); } 60% { transform:translate(-4px,2px); } 80% { transform:translate(3px,-1px); } }
</style>
</head>
<body class="uno">
<div id="felt"></div>
<header><b id="title">PULSE <i>GAMES</i></b><span id="code"></span><button id="mute" title="Sound">&#128266;</button></header>

<section class="screen on" id="join">
  <div class="panel">
    <h2 id="joinTitle">Join the game</h2>
    <p class="soft" id="joinSub">You'll play against an Ollee watch.</p>
    <input id="name" maxlength="14" placeholder="Your name" autocomplete="nickname">
    <div class="row"><button id="joinBtn">Join</button></div>
  </div>
</section>

<section class="screen" id="lobby">
  <div class="panel">
    <h2>You're in!</h2>
    <p class="soft" id="lobbyMsg">Waiting for the host to start.</p>
    <div class="chips" id="lobbyPlayers"></div>
    <div class="row"><button id="startBtn">Start</button></div>
  </div>
</section>

<section class="screen" id="game">
  <div id="opps"></div>
  <div id="table"><div id="ring"></div><div id="deckpile"><div id="deck"></div><div id="pile"></div></div></div>
  <div id="status"></div>
  <div id="actions">
    <button class="ghost" id="drawBtn">Draw</button>
    <button class="ghost" id="passBtn">Keep &amp; pass</button>
    <button class="hot" id="doneBtn">Done</button>
  </div>
  <div id="hand"></div>
</section>

<section class="screen" id="buck">
  <div id="bk">
    <canvas id="scene" width="200" height="150"></canvas>
  </div>
  <div id="bkmsg"></div>
  <div id="bkitems"></div>
  <div id="bkact">
    <button class="shoot" id="shootThem">Shoot</button>
    <button class="ghost" id="shootSelf">Shoot yourself</button>
  </div>
</section>

<section class="screen" id="over">
  <div class="panel">
    <div class="win" id="winText"></div>
    <div class="score" id="scoreText"></div>
    <div class="row"><button id="againBtn">Play again</button></div>
  </div>
</section>

<section class="screen" id="ended">
  <div class="panel">
    <h2>The game ended</h2>
    <p class="soft">The host closed the party. Thanks for playing!</p>
  </div>
</section>

<div class="pick" id="pick"><div class="sheet">
  <h2>Pick a color</h2>
  <div class="swatches">
    <button style="background:var(--r)" data-c="0"></button><button style="background:var(--g)" data-c="1"></button>
    <button style="background:var(--b)" data-c="2"></button><button style="background:var(--y)" data-c="3"></button>
  </div>
  <div class="row"><button class="ghost" id="pickCancel">Cancel</button></div>
</div></div>
<div id="fx"></div>
<div id="flash"></div>
<div id="crt"></div>
<canvas id="confetti"></canvas>
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var HEX = ['#ef4444', '#22c55e', '#3b82f6', '#facc15'];
  var Q = new URLSearchParams(location.search), DB = (Q.get('db') || '').replace(/\/+$/, ''), GAME = Q.get('g') || '';
  var ONLINE = !!(DB && GAME);
  var token = '', ver = -1, seq = -1, st = null, kind = '', busy = false;
  var queue = [], animating = false, es = null;
  var KEY = 'pulseToken' + (GAME || location.host);
  try { token = sessionStorage.getItem(KEY) || ''; } catch (e) {}

  // ================= small helpers =================
  function show(id) { ['join', 'lobby', 'game', 'buck', 'over', 'ended'].forEach(function (s) { $(s).classList.toggle('on', s === id); }); }
  function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove('on'); }, 2000); }
  function getJ(path) { return fetch(path, { cache: 'no-store' }).then(function (r) { return r.json(); }); }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }
  function rectOf(el) { return el.getBoundingClientRect(); }
  function center(r) { return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }
  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  function setKind(k) {
    if (!k || k === kind) return;
    kind = k;
    document.body.className = k;
    $('title').innerHTML = k === 'buck' ? 'BUCK<i>SHOT</i>' : 'PULSE <i>UNO</i>';
    document.title = k === 'buck' ? 'Buckshot' : 'Pulse UNO';
    $('joinTitle').textContent = k === 'buck' ? 'Take a seat' : 'Join the game';
    $('joinSub').textContent = k === 'buck' ? 'Two players. One shotgun. You against the watch.' : "You'll play against an Ollee watch.";
    $('startBtn').textContent = k === 'buck' ? 'Load the shotgun' : 'Deal the cards';
    if (k === 'buck') ambient();
    document.querySelector('meta[name=theme-color]').content = k === 'buck' ? '#0a0a09' : '#0b1424';
  }

  // ================= sound: made on the fly, no files =================
  var AC = null, master = null, verb = null, amb = null, muted = false;
  try { muted = localStorage.getItem('pulseMute') === '1'; } catch (e) {}
  function muteIcon() { $('mute').innerHTML = muted ? '&#128263;' : '&#128266;'; }
  muteIcon();
  $('mute').onclick = function () {
    muted = !muted; try { localStorage.setItem('pulseMute', muted ? '1' : '0'); } catch (e) {}
    muteIcon(); unlock();
    if (master) master.gain.setTargetAtTime(muted ? 0 : 1, AC.currentTime, .05);
  };
  function unlock() {
    if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    master = AC.createGain(); master.gain.value = muted ? 0 : 1; master.connect(AC.destination);
    // a small concrete room: a made-up echo for the big sounds
    verb = AC.createConvolver();
    var len = Math.floor(AC.sampleRate * 1.6), ir = AC.createBuffer(2, len, AC.sampleRate);
    for (var c = 0; c < 2; c++) { var d = ir.getChannelData(c); for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2); }
    verb.buffer = ir;
    var vg = AC.createGain(); vg.gain.value = .45; verb.connect(vg); vg.connect(master);
    ambient();
  }
  document.addEventListener('pointerdown', unlock);
  function route(g, rv) {
    g.connect(master);
    if (rv) { var s = AC.createGain(); s.gain.value = rv; g.connect(s); s.connect(verb); }
  }

      case 0:
        sfx('ting');
        if (me) { pop(st.peek === 1 ? 'live' : 'blank', st.peek === 1 ? 'LIVE' : 'BLANK', 'ONLY YOU SAW THAT', st.peek === 1 ? '#e04a2e' : '#9fb3c4', 1800); say('YOU PEEK IN THE CHAMBER: ' + (st.peek === 1 ? '<b>LIVE</b>.' : 'BLANK.')); }
        else { pop(0, 'MAGNIFIER', name + ' TAKES A LOOK'); B.glint = 1; say(name + ' PEEKS INTO THE CHAMBER. <b>IT KNOWS.</b>'); }
        return wait(1800);
      case 1:
        sfx('chain'); v.cuffed[other] = true;
        pop(1, 'HANDCUFFS', other === you ? 'YOU SKIP A TURN' : name.slice(0, 10) + ' SKIPS A TURN');
        return wait(1400);
      case 2:
        sfx('glug'); pop(2, 'BEER', 'RACK OUT THE SHELL');
        return wait(1200);
      case 3:
        sfx('lighter'); pop(3, 'CIGARETTES', '+1 LIFE');
        return wait(700).then(function () {
          smoke(me ? 100 : 100, me ? 128 : 32, 14, '190,184,172');
          v.hp[e.by] = Math.min(max, v.hp[e.by] + 1); B.glow = e.by; B.glowTo = performance.now() + 1100; sfx('heal');
          return wait(900);
        });
      case 4:
        sfx('saw'); pop(4, 'HAND SAW', 'NEXT HIT DOES 2');
        var n = 0, iv = setInterval(function () { var tp = gunTip(); sparks(tp.x + 8, tp.y, 4); if (++n > 9) clearInterval(iv); }, 85);
        return wait(900).then(function () { v.saw = true; return wait(700); });
      case 5:
        sfx('warble'); pop(5, 'INVERTER', 'LIVE AND BLANK SWAP');
        return wait(1400);
      case 7:
        sfx('rattle'); pop(7, 'PILLS', '50 / 50 ...', null, 1100);
        return wait(1150).then(function () {
          if (e.n > 0) { v.hp[e.by] = Math.min(max, v.hp[e.by] + 2); B.glow = e.by; B.glowTo = performance.now() + 1200; sfx('heal'); pop(7, '+2 LIVES', 'LUCKY', '#d9b34a', 1100); }
          else { var b = v.hp[e.by]; v.hp[e.by] = Math.max(0, b - 1); if (b > 0) breakHeart(e.by, b - 1); sfx('hurt'); if (me) B.red = .7; else B.knock = .7; pop(7, '-1 LIFE', 'BAD BATCH', '#e04a2e', 1100); }
          return wait(1200);
        });
      case 8:
        sfx('swirl'); pop(8, 'TWIST', 'EVERY SHELL FLIPS');
        return tween(900, function (k) { B.spin = ease(k) * Math.PI * 2; }).then(function () { B.spin = 0; return wait(500); });
    }
    sfx('pop');
    return wait(1100);
  }
  function winAnim(e) {
    var name = esc(oppName());
    if (e.by === st.you) {
      say('<b>' + name + ' SLUMPS OVER.</b> THE LIGHT FLICKERS.');
      return wait(250).then(function () {
        sfx('thud'); B.flick = 24;
        return tween(800, function (k) { B.slump = ease(k); });
      }).then(function () { sfx('walk'); return wait(1500); });
    }
    say('<b>THE ROOM GOES QUIET.</b>');
    sfx('flatline');
    return tween(1600, function (k) { B.dark = k * .92; }).then(function () { return wait(500); });
  }

  // ================= confetti =================
  function confetti() {
    var cv = $('confetti'), x = cv.getContext('2d'), W = cv.width = innerWidth, H = cv.height = innerHeight, bits = [];
    var cols = kind === 'buck' ? ['#e7dccb', '#c2361f', '#d9b34a', '#8a7f6e'] : HEX;
    for (var i = 0; i < 140; i++) bits.push({ x: Math.random() * W, y: -20 - Math.random() * H * .5, r: 4 + Math.random() * 5, c: cols[i % 4], vy: 2 + Math.random() * 3, vx: -1 + Math.random() * 2, a: Math.random() * 6 });
    var t = 0;
    (function frame() {
      x.clearRect(0, 0, W, H);
      bits.forEach(function (b) { b.y += b.vy; b.x += b.vx; b.a += .1; x.save(); x.translate(b.x, b.y); x.rotate(b.a); x.fillStyle = b.c; x.fillRect(-b.r, -b.r / 2, b.r * 2, b.r); x.restore(); });
      if (++t < 220) requestAnimationFrame(frame); else x.clearRect(0, 0, W, H);
    })();
  }

  window.addEventListener('resize', function () { if (kind === 'buck') fitScene(); if (st && st.started && !animating) render(); });
  if (token) listen();
})();
</script>
</body>
