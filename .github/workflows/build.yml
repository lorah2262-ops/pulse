name: Build Pulse

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Check watch face is valid ES5
        run: |
          for f in Pulse DayPack; do
            sed 's/^const subscribe/var subscribe/' watch/$f.min.js > /tmp/es5.js
            npx --yes esbuild@0.24.0 /tmp/es5.js --target=es5 --log-level=warning > /dev/null
            cmp watch/$f.min.js app/src/main/assets/$f.min.js || { echo "::error::watch/$f.min.js and the app's copy differ"; exit 1; }
          done
          node tools/watch-sim-daypack.js watch/DayPack.min.js

      - name: Remove older releases and their tags (only the newest is kept)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r t; do
            gh release delete "$t" --cleanup-tag --yes
          done
          git ls-remote --tags origin | awk '{print $2}' | sed 's#refs/tags/##' | grep '^build-' | while read -r t; do
            git push origin ":refs/tags/$t" || true
          done

      - name: Build APK
        env:
          PULSE_KS_PASS: ${{ secrets.PULSE_KS_PASS }}
        run: |
          if [ -z "$PULSE_KS_PASS" ]; then echo "::error::Add the PULSE_KS_PASS secret (Settings > Secrets and variables > Actions)"; exit 1; fi
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Pulse.apk
          cp watch/Pulse.min.js out/Pulse.min.js
          ls -la out

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          MSG=$(git log -1 --pretty=%s)
          gh release create "$TAG" out/Pulse.apk out/Pulse.min.js \
            --title "Pulse build ${{ github.run_number }}" \
            --notes "$MSG" --latest
